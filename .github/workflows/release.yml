name: Release Obsidian plugin

# The release build is the artifact a user actually installs, so it is held to
# a stricter standard than PR CI, not a looser one (HARDENING-PLAN F-01):
#
#   - identical install to CI and to local Gate 1: `pnpm install
#     --frozen-lockfile`, install scripts disabled by `.npmrc`. It used to run
#     `npm install --legacy-peer-deps`, which resolves a *different* tree from
#     the pnpm lockfile the maintainer and CI build against — that alone can
#     make the released `main.js` byte-differ from any local rebuild, which
#     defeats the hash comparison below before it starts.
#   - the full `pnpm gate:1` (lint, typecheck, build, test, css-lint, the
#     lockfile registry check, both bundle tripwires) plus
#     `pnpm check:reproducible` run here, before anything is published,
#     because a tag can be pushed from a branch CI never saw and a release
#     built from red code is worse than a release built late (PR #6 review
#     follow-up, HARDENING-STATUS.md §B.2). A final `pnpm build` runs after
#     `check:reproducible` so the exact bytes hashed, attested and uploaded
#     below come from one unambiguous production build, not from whichever
#     of `check:reproducible`'s two internal builds happened to run last.
#   - the trigger is restricted to release tags and a guard step fails the
#     job outright if the pushed tag does not equal `manifest.json`'s
#     `version`, so a mistyped tag can never publish a mislabeled build.
#     This fork's tags are bare semver (`1.27.0`, no `v` prefix) — that is
#     what `versions.json` and `CHANGELOG.md` key on, and what Obsidian's own
#     update mechanism requires: the release tag name must equal
#     `manifest.json`'s `version` field verbatim.
#   - `SHA256SUMS` published with the release so `scripts/verify-release.mjs`
#     (and any user) can rebuild from the tag and diff.
#   - build provenance attestation retained: it proves the artifact came from
#     this repository's CI. It does NOT prove the source is benign — the hash
#     comparison against a local rebuild is what closes that gap.
#
# Every `uses:` is pinned to a commit SHA (Phase 6.1 — F-07).

on:
  push:
    tags:
      # Bare semver, matching versions.json / CHANGELOG.md / manifest.json —
      # NOT the generic `v*` GitHub convention. GitHub Actions tag filters use
      # git's fnmatch-style glob, where `+` means "one or more of the
      # preceding character", so `[0-9]+` matches one or more digits; the
      # trailing `*` also admits a pre-release/build suffix (e.g. `-beta.1`)
      # without matching an unrelated tag such as `karpathywiki-hardened`.
      - "[0-9]+.[0-9]+.[0-9]+*"

# Read-only by default. The single job below opts into exactly the write
# scopes it needs, and nothing else in this workflow gets them (Phase 6.2).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # OIDC token for the provenance attestation
      attestations: write # write the attestation itself
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.14.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          cache: 'pnpm'

      - name: Guard — tag must match manifest.json version
        # Fails fast, before install/build are spent on a tag nobody meant to
        # release. `manifest.json` is the file Obsidian reads to decide what
        # version a user is running, so a tag/manifest mismatch here would
        # otherwise ship (and attest, and hash) a build labeled with the
        # wrong version.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest_version" ]; then
            echo "::error::Tag '$tag' does not match manifest.json version '$manifest_version' — refusing to publish a mislabeled build."
            exit 1
          fi
          echo "Tag '$tag' matches manifest.json version '$manifest_version'."

      - name: Install (lockfile-pinned, install scripts disabled)
        run: pnpm install --frozen-lockfile

      - name: Full gate — lint, typecheck, build, test, css-lint, lockfile registry, bundle tripwires
        # Everything PR CI enforces, re-run here: a tag can be pushed from a
        # branch CI never saw, so the release job cannot assume the code it
        # is about to publish was ever gated (PR #6 review / HARDENING-STATUS
        # §B.2). Includes the `pnpm build` whose `main.js` the checks below
        # then read.
        run: pnpm gate:1

      - name: Reproducible build (F-01 detection)
        # Two builds from the same tree must produce the same sha256, same
        # invariant PR CI checks. This also leaves a fresh production
        # `main.js` on disk (see scripts/verify-reproducible-build.mjs) — the
        # step below rebuilds once more anyway so the artifact that gets
        # hashed/attested/uploaded is unambiguously from a single final
        # `pnpm build`, not an artifact of how this check happens to work.
        run: pnpm check:reproducible

      - name: Build plugin (final — this is the artifact that gets hashed and attested)
        run: pnpm build

      - name: Publish build hashes
        # `SHA256SUMS` is the anchor for `scripts/verify-release.mjs`: check
        # out the tag, rebuild, and the two hashes must match. esbuild output
        # is byte-stable for this config (no minification, no embedded date),
        # so a mismatch means the released artifact was not built from the
        # tagged source.
        run: |
          sha256sum main.js styles.css > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SBOM
        # NOTE: `npx` downloads @cyclonedx/cyclonedx-npm from the registry at
        # release time — a network fetch inside the release job. It is pinned
        # to an exact version (never a range) so the downloaded code is fixed,
        # and it runs AFTER the build so it cannot influence `main.js`. The
        # residual risk is a compromised release of that exact version being
        # republished under the same version number, which npm's immutability
        # policy forbids. Accepted rather than vendoring the tool into
        # devDependencies, where it would enlarge every contributor's tree.
        #
        # `--package-lock-only` is not optional here: without it cyclonedx-npm
        # shells out to `npm ls --all` against `node_modules/`, which pnpm laid
        # out as a symlink store npm cannot read. `npm ls` then exits non-zero
        # ("missing"/"invalid" for effectively every package) and cyclonedx-npm
        # aborts with `npm-ls exited with errors: 1`, failing the release after
        # the artifacts are already built. `--ignore-npm-errors` covers the
        # residual `npm ls` complaints about peer dependencies the lockfile
        # does not pin. Verified locally: 0 exit, 395 components.
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
            --package-lock-only \
            --ignore-npm-errors \
            --output-file sbom.json
        # cyclonedx-npm reads package-lock.json, which is committed alongside
        # pnpm-lock.yaml for exactly this kind of npm-ecosystem tooling.

      - name: Generate artifact attestation for main.js
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: main.js

      - name: Generate artifact attestation for styles.css
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css SHA256SUMS sbom.json
