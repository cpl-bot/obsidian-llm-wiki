name: Gate 1 (Five-Gate)

# Defense-in-depth layer on top of the per-fix E2E handoff (CLAUDE.md §"Six-Gate
# Quality Closure" / §"Per-fix E2E handoff"). Gate 1 is verified locally before
# `git push`; this CI re-runs the same five checks on every PR against `main`
# so reviewer never sees a mechanical failure that slipped through.
#
# CI does NOT enable auto-merge. Explicit "merge it" / "合并" from the
# maintainer is still required (CLAUDE.md "NEVER auto-merge PRs").
#
# Obsidian Bot review remains a separate pipeline; CI green ≠ Bot-approved.
# See [[feedback_obsidian_bot_double_lint]] for the double-lint invariant.
#
# Lockfile-pinned install (`pnpm install --frozen-lockfile`) keeps the lockfile
# authoritative AND prevents `eslint-plugin-obsidianmd` drift between local
# Gate 1 and CI. `npm ci` is NOT used because:
#   - the project's `packageManager` field pins pnpm@10.14.0
#   - pnpm-specific `overrides` (flat format per `feedback_pnpm_vs_npm_overrides_incompatibility`)
#     are not honored by npm
#   - pnpm cache key (`pnpm-lock.yaml` hash) keeps CI fast
# The install is script-free by policy: `.npmrc` sets `ignore-scripts=true` and
# `pnpm-workspace.yaml` re-enables exactly one package via
# `onlyBuiltDependencies: [esbuild]`, so the platform binary esbuild needs is
# still fetched while no other package in the tree gets to execute code at
# install time (HARDENING-PLAN Phase 1, task 1.4 — F-02/F-05).
# The Bot alignment step at release time remains the final word on plugin
# version per "Bot alignment (pre-release)" under §"Gate 1: Five-Gate automated".
#
# Every `uses:` below is pinned to a commit SHA, not a tag (HARDENING-PLAN
# Phase 6.1 — F-07). Tags are mutable: the 2025 `tj-actions/changed-files`
# compromise was published by moving existing tags onto a hostile commit, and
# every workflow that trusted `@v4` ran it. The trailing `# vX.Y.Z` comment is
# the human-readable version; `.github/dependabot.yml` bumps both together.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate-1:
    name: Gate 1 / Five-Gate
    runs-on: ubuntu-latest
    # No job-level `permissions:` override — this job only reads the checkout.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.14.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install (lockfile-pinned, install scripts disabled)
        run: pnpm install --frozen-lockfile

      # Supply-chain gates (HARDENING-PLAN Phase 1, tasks 1.5-1.6).
      # These run before the Five-Gate block because a lockfile that points
      # at the wrong registry, or a tree with an unfixed HIGH advisory, is a
      # finding the reviewer needs regardless of whether the code compiles.

      - name: Lockfile registry check (F-02)
        # Rejects any `resolved` URL in package-lock.json, and any absolute
        # URL in pnpm-lock.yaml, that is not on registry.npmjs.org. The
        # committed lockfile carried 358 registry.npmmirror.com entries until
        # v1.27.0 despite .npmrc pinning the official registry; nothing caught
        # it because the tree still installed. This is what catches it.
        run: pnpm check:lockfile

      - name: Audit production dependencies (blocking)
        # Anything HIGH or CRITICAL that ships inside main.js. This must never
        # be waived: it is the dependency surface a plugin user actually runs.
        # `npm audit` needs only package-lock.json plus network access, so it
        # is unaffected by the pnpm-managed node_modules above.
        run: npm audit --audit-level=high --omit=dev --registry=https://registry.npmjs.org/

      - name: Audit all dependencies including dev (blocking)
        # Dev-only advisories (F-05, fast-uri 3.1.5) reach contributors'
        # machines and CI runners even though they never reach a user. Policy:
        # this step is blocking. If a dev-only HIGH appears upstream with no
        # published fix, add `continue-on-error: true` to THIS step only —
        # never to the --omit=dev step above — record the advisory ID and the
        # reason in the PR description, and remove the flag as soon as a fix
        # lands. A permanently non-blocking audit is the same as no audit.
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      - name: Five-Gate (lint + typecheck + build + test + css-lint)
        # Order is non-negotiable: `build` MUST run before `test`. The test
        # suite contains build-artifact verifications (e.g.
        # `src/__tests__/llm-sdk/openai-codex-loopback-flow.test.ts:39` reads
        # `main.js` to assert the esbuild bundle shape), so a test-first run
        # fails with ENOENT on a fresh CI clone where `main.js` doesn't exist
        # yet. Local Gate 1 typically has `main.js` on disk from a prior
        # `pnpm build:dev`, which is why this ordering bug was missed before
        # the first CI run. CLAUDE.md §"Gate 1: Five-Gate automated" carries
        # the corrected order.
        run: |
          set -e
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test
          pnpm css-lint

      # Bundle tripwires (HARDENING-PLAN Phase 2.A / Phase 4.5). These read
      # the `main.js` the step above produced, so they cannot run earlier.

      - name: Bundle tripwire — MinerU removed (F-06)
        run: pnpm check:bundle-mineru

      - name: Bundle tripwire — no unaccounted hostname (F-04)
        run: pnpm check:bundle-hosts

      - name: Reproducible build (F-01 detection)
        # Two builds from the same tree must produce the same sha256. If they
        # ever diverge, a released `main.js` can no longer be checked against
        # a local rebuild, and the provenance attestation degrades to "CI
        # built something" rather than "CI built exactly this source".
        run: pnpm check:reproducible
