name: CodeQL

# Static analysis (HARDENING-PLAN Phase 6.4 — closes half of F-10: "no SAST in
# CI"). ESLint checks style and `tsc` checks types; neither looks for taint
# flows, injection sinks, or unsafe dynamic evaluation. The Phase 0 baseline
# established that the shipped source currently has no `eval`, `new Function`,
# `innerHTML`, or `child_process` — CodeQL is what keeps that true after an
# upstream merge nobody read line by line.
#
# `javascript-typescript` covers both `src/` and the `.mjs` scripts. No build
# step is configured: CodeQL extracts JS/TS directly from source, and running
# esbuild first would only hand it a 4 MB bundle to re-analyse.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:17 UTC. Off the hour on purpose — GitHub's scheduler
    # queues heavily at :00. A weekly run matters because CodeQL's query pack
    # gains new rules over time: the same unchanged code can become a finding.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
